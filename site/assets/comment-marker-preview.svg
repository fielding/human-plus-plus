  <rect x="40" y="246" width="590" height="22" rx="4" fill="#1ad0d6"/>
  <text x="48" y="263" font-family="SF Mono, Consolas, monospace" font-size="13" fill="#1a1c22" font-weight="700">// NB: redirects intentionally preserve the query string</text>
  <text x="650" y="263" font-family="SF Mono, Consolas, monospace" font-size="12" fill="#1ad0d6" font-weight="700">&gt;&gt;</text>

  <rect x="40" y="274" width="590" height="22" rx="4" fill="#bbff00"/>
  <text x="48" y="291" font-family="SF Mono, Consolas, monospace" font-size="13" fill="#1a1c22" font-weight="700">// !! Explicit punctuation always works too</text>
