  <rect x="40" y="302" width="590" height="22" rx="4" fill="#1ad0d6"/>
  <text x="48" y="319" font-family="SF Mono, Consolas, monospace" font-size="13" fill="#1a1c22" font-weight="700">// &gt;&gt; Explicit context note stays visible</text>
  <text x="650" y="319" font-family="SF Mono, Consolas, monospace" font-size="12" fill="#1ad0d6" font-weight="700">&gt;&gt;</text>

  <text x="44" y="346" font-family="SF Mono, Consolas, monospace" font-size="12" fill="#828079">Aliases are case-insensitive; strongest marker wins when multiple keywords appear.</text>
